<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Cardinatorinator 3000</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            transition: background-color 0.3s, color 0.3s;
            overflow: hidden;
        }
        .panel {
            position: absolute;
            resize: both;
            overflow: auto;
            min-width: 380px;
            min-height: 300px;
            display: flex;
            flex-direction: column;
        }
        .panel-header {
            cursor: move;
            flex-shrink: 0;
        }
        .panel-content {
            flex-grow: 1;
            overflow-y: auto;
        }
        .control-panel label {
            font-weight: 500;
        }
        .control-panel input[type="text"], .control-panel input[type="number"], .control-panel select {
            border: 1px solid #D1D5DB;
            padding: 8px 12px;
            border-radius: 6px;
            width: 100%;
            transition: border-color 0.2s, background-color 0.3s, color 0.3s;
        }
        .dark .control-panel input[type="text"], .dark .control-panel input[type="number"], .dark .control-panel select {
            background-color: #374151;
            border-color: #4b5563;
        }
        .control-panel input[type="color"] {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            width: 32px;
            height: 32px;
            padding: 0;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background-color: transparent;
        }
        .control-panel input[type="color"]::-webkit-color-swatch {
            border-radius: 6px;
            border: 1px solid #d1d5db;
        }
        .control-panel input[type="color"]::-moz-color-swatch {
            border-radius: 6px;
            border: 1px solid #d1d5db;
        }
        .control-panel input:focus, .control-panel select:focus {
            outline: none;
            border-color: #4F46E5;
            box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.2);
        }
        .dark .control-panel input[type="color"]::-webkit-color-swatch {
            border-color: #4b5563;
        }
        .dark .control-panel input[type="color"]::-moz-color-swatch {
            border-color: #4b5563;
        }
        #preview-container {
            position: absolute;
            top: 150px; /* Back to original position */
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            overflow: auto;
        }
        #preview-area {
            width: 1200px;
            height: 720px;
            position: relative;
            overflow: hidden;
            background-color: #e5e7eb;
            border-radius: 8px;
            transition: background-color 0.3s;
            flex-shrink: 0;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        .dark #preview-area {
            background-color: #374151;
        }
        .checkbox-label {
            display: flex;
            align-items: center;
            cursor: pointer;
        }
        .checkbox-label input {
            margin-right: 8px;
        }
        .layer-item {
            padding: 0.75rem;
            border: 2px solid transparent;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s, border-color 0.2s;
        }
        .layer-item.active {
            border-color: #4F46E5;
            background-color: #EEF2FF;
        }
        .dark .layer-item.active {
            border-color: #818CF8;
            background-color: #3730A3;
        }
        #layers-widget {
            position: fixed;
            bottom: 1rem;
            right: 1rem;
            width: 380px;
            z-index: 50;
        }
        #layers-widget-body {
            max-height: 400px;
            overflow-y: auto;
            display: block;
            transition: max-height 0.3s ease-out, padding 0.3s ease-out;
        }
        #layers-widget.collapsed #layers-widget-body {
            max-height: 0;
            padding-top: 0;
            padding-bottom: 0;
            overflow: hidden;
        }
        #layers-widget-header .toggle-arrow {
           transition: transform 0.3s;
        }
        #layers-widget.collapsed #layers-widget-header .toggle-arrow {
            transform: rotate(180deg);
        }
        #top-toolbar {
            min-height: 150px; 
            display: flex;
            align-items: center;
            padding: 1rem;
            background-color: #fff;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }
        .dark #top-toolbar {
             background-color: #1f2937;
        }
        .history-btn {
            background: none;
            border: none;
            padding: 0.5rem;
            cursor: pointer;
        }
        .history-btn:disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }
        .style-button {
            width: 32px;
            height: 32px;
            border: 1px solid #D1D5DB;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s, border-color 0.2s;
        }
        .dark .style-button {
            border-color: #4b5563;
        }
        .style-button.active {
            background-color: #EEF2FF;
            border-color: #4F46E5;
            color: #4F46E5;
        }
        .dark .style-button.active {
            background-color: #3730A3;
            border-color: #818CF8;
            color: #818CF8;
        }
        /* Custom Slider Thumb Styles */
        input[type=range] {
            -webkit-appearance: none;
            appearance: none;
            background: transparent;
            cursor: pointer;
            width: 100%;
        }
        input[type=range]:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        input[type=range]::-webkit-slider-runnable-track {
            background: #e5e7eb;
            height: 4px;
            border-radius: 2px;
        }
        .dark input[type=range]::-webkit-slider-runnable-track {
            background: #4b5563;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            margin-top: -6px; /* Center thumb on track */
            background-color: #fff;
            border: 2px solid #111827;
            height: 16px;
            width: 16px;
            border-radius: 50%;
        }
        .dark input[type=range]::-webkit-slider-thumb {
             background-color: #cbd5e1;
             border: 2px solid #94a3b8;
        }
        input[type=range]::-moz-range-track {
            background: #e5e7eb;
            height: 4px;
            border-radius: 2px;
        }
        .dark input[type=range]::-moz-range-track {
            background: #4b5563;
        }
        input[type=range]::-moz-range-thumb {
            background-color: #fff;
            border: 2px solid #111827;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            cursor: pointer;
        }
        .dark input[type=range]::-moz-range-thumb {
             background-color: #cbd5e1;
             border: 2px solid #94a3b8;
        }
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s ease-out, visibility 0s 0.2s;
        }
        .modal-overlay.visible {
            opacity: 1;
            visibility: visible;
            transition: opacity 0.2s ease-out;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            text-align: center;
        }
        .control-row {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            width: 100%;
            justify-content: center;
        }
        .control-row.disabled {
            opacity: 0.5;
            pointer-events: none;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 dark:bg-gray-900 dark:text-gray-200 h-screen">

    <div class="flex flex-col h-screen">
        <header class="p-4 border-b dark:border-gray-700">
            <div class="container mx-auto flex justify-between items-center">
                <div class="flex items-center gap-x-4">
                     <div class="inline-flex items-center border border-gray-300 dark:border-gray-600 rounded-md">
                         <button id="undo-btn" class="history-btn" title="Undo">
                             <svg class="w-5 h-5 text-gray-600 dark:text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 15L3 9m0 0l6-6M3 9h12a6 6 0 010 12h-3"></path></svg>

                <div id="layers-widget-header" class="flex justify-between items-center p-4 border-b dark:border-gray-700 cursor-pointer">

    <div id="edit-background-url-modal" class="modal-overlay">

    <div id="delete-confirm-modal" class="modal-overlay">

            <h3 class="text-lg font-bold mb-2">Confirm Deletion</h3>

            <div class="flex justify-end space-x-4 mt-4">
                <button id="delete-cancel-btn" class="px-4 py-2 rounded bg-gray-200 dark:bg-gray-600">Cancel</button>

    <div id="export-code-modal" class="modal-overlay">
        <div class="bg-white dark:bg-gray-800 p-6 rounded-lg shadow-xl w-2/3 max-w-4xl flex flex-col">

                <h3 class="text-lg font-bold">Export Code</h3>
                <button id="modal-export-close" class="text-gray-400 hover:text-gray-600 text-2xl">&times;</button>
            </div>
            <textarea id="modal-code-output" readonly class="w-full flex-grow p-2 border rounded dark:bg-gray-900 dark:border-gray-600 font-mono text-sm resize-none"></textarea>
            <div class="flex justify-end space-x-4 mt-4">
                <button id="modal-copy-button" class="flex items-center space-x-2 px-4 py-2 rounded bg-indigo-600 text-white hover:bg-indigo-700">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                    <span id="copy-text">Copy</span>
                </button>
            </div>
        </div>
    </div>

    <textarea id="code-output" readonly class="!absolute !-left-[9999px]"></textarea>

    <script>
        const previewArea = document.getElementById('preview-area');
        const codeOutput = document.getElementById('code-output');
        const exportButton = document.getElementById('export-button');
        const copyFeedback = document.getElementById('copy-feedback');
        const layersPanel = document.getElementById('layers-panel');
        const controlsContainer = document.getElementById('top-toolbar');
        const addTextLineButton = document.getElementById('add-text-line');
        const addHeadshotLayerButton = document.getElementById('add-headshot-layer');
        const addBackgroundLayerButton = document.getElementById('add-background-layer');
        const layersWidget = document.getElementById('layers-widget');
        const layersWidgetHeader = document.getElementById('layers-widget-header');
       
        const editTextModal = document.getElementById('edit-text-modal');
        const modalTextInput = document.getElementById('modal-text-input');
        const modalSaveButton = document.getElementById('modal-save');
        const modalCancelButton = document.getElementById('modal-cancel');

        const editImageUrlModal = document.getElementById('edit-image-url-modal');
        const modalImageUrlInput = document.getElementById('modal-image-url-input');
        const modalImageUrlSaveButton = document.getElementById('modal-image-url-save');
        const modalImageUrlCancelButton = document.getElementById('modal-image-url-cancel');

        const editBackgroundUrlModal = document.getElementById('edit-background-url-modal');
        const modalBackgroundUrlInput = document.getElementById('modal-background-url-input');
        const modalBackgroundUrlSaveButton = document.getElementById('modal-background-url-save');
        const modalBackgroundUrlCancelButton = document.getElementById('modal-background-url-cancel');

        const deleteConfirmModal = document.getElementById('delete-confirm-modal');
        const deleteConfirmBtn = document.getElementById('delete-confirm-btn');
        const deleteCancelBtn = document.getElementById('delete-cancel-btn');

        const exportCodeModal = document.getElementById('export-code-modal');
        const modalCodeOutput = document.getElementById('modal-code-output');
        const modalExportCloseButton = document.getElementById('modal-export-close');
        const modalCopyButton = document.getElementById('modal-copy-button');
        const modalCopyText = document.getElementById('copy-text');


        const undoBtn = document.getElementById('undo-btn');
        const redoBtn = document.getElementById('redo-btn');

        let currentEditingLayerId = null;
        let layerToDeleteId = null;

        let state = {
            layers: [],
            selectedIds: [],
        };

        let history = [];
        let redoStack = [];
        let lastClickedLayerId = null;

        function saveState() {
            redoStack = []; // Clear redo stack on new action
            history.push(JSON.parse(JSON.stringify(state)));
            if (history.length > 30) { // Limit history size
                history.shift();
            }
            updateHistoryButtons();
        }

        function undo() {
            if (history.length > 1) {
                redoStack.push(history.pop());
                state = JSON.parse(JSON.stringify(history[history.length - 1]));
                renderFullUI();
                updateHistoryButtons();
            }
        }

        function redo() {
            if (redoStack.length > 0) {
                const nextState = redoStack.pop();
                history.push(nextState);
                state = JSON.parse(JSON.stringify(nextState));
                renderFullUI();
                updateHistoryButtons();
            }
        }

        function updateHistoryButtons() {
            undoBtn.disabled = history.length <= 1;
            redoBtn.disabled = redoStack.length === 0;
        }

        undoBtn.addEventListener('click', undo);
        redoBtn.addEventListener('click', redo);


        function createLayer(type, options = {}) {
            const id = `layer-${Date.now()}-${Math.random()}`;
            const baseLayer = { id, type };
            if (type === 'background') {
                return { ...baseLayer, name: options.name || 'Background', url: options.url || 'https://images.unsplash.com/photo-1557683316-973673baf926?q=80&w=2029&auto=format&fit=crop', deletable: options.deletable || false };
            } else if (type === 'headshot') {
                return {
                    ...baseLayer, name: 'Headshot', url: options.url || 'https://s3.us-east-2.amazonaws.com/snoball-production/YHksDYftUFAlaLydO6GHOTt2V8fMDK.png', 
                    shape: 'circle', width: 250, height: 250, x: 0, y: 0, rotation: 0,
                    borderWidth: 6, borderColor: '#65FC7C', cornerRadius: 8, showDefault: true,
                    deletable: true
                };
            } else { // text
                return {
                    ...baseLayer, name: options.text || 'New Text Line', text: options.text || 'New Text Line', 
                    fontSize: options.fontSize || 24, color: options.color || '#FFFFFF', fontFamily: options.ff || 'Poppins', 
                    justify: options.justify || 'center', x: 0, y: 0, rotation: 0, maxWidth: options.maxWidth || 450,
                    isBold: false, isItalic: false, isUnderline: false, deletable: true,
                };
            }
        }
       
        function renderFullUI() {
            renderLayersPanel();
            renderControlsPanel();
            renderPreviewAndCode();
        }

        function renderAndSave() {
            renderFullUI();
            saveState();
        }

        function handleLayerSelection(id, event) {
            const currentSelection = new Set(state.selectedIds);
            if (event.shiftKey && lastClickedLayerId) {
                const layerOrder = state.layers.map(item => item.id);
                const lastIndex = layerOrder.indexOf(lastClickedLayerId);
                const currentIndex = layerOrder.indexOf(id);
                if (lastIndex !== -1 && currentIndex !== -1) {
                    const [start, end] = [lastIndex, currentIndex].sort((a, b) => a - b);
                    const layersToSelect = layerOrder.slice(start, end + 1);
                    layersToSelect.forEach(layerId => currentSelection.add(layerId));
                } else { 
                    currentSelection.add(id);
                }
            } else if (event.ctrlKey || event.metaKey) {
                if (currentSelection.has(id)) {
                    currentSelection.delete(id);
                } else {
                    currentSelection.add(id);
                }
            } else {
                currentSelection.clear();
                currentSelection.add(id);
            }
            state.selectedIds = Array.from(currentSelection);
            lastClickedLayerId = id;
            renderFullUI();
        }

        function renderLayersPanel() {
            layersPanel.innerHTML = '';
            [...state.layers].reverse().forEach(layer => {
                layersPanel.appendChild(createLayerItemDOM(layer));
            });
        }
       
        function createLayerItemDOM(layer) {
            const layerItem = document.createElement('div');
            const isDefaultBg = layer.type === 'background' && !layer.deletable;
            layerItem.className = `layer-item flex items-center dark:bg-gray-700/50 ${state.selectedIds.includes(layer.id) ? 'active' : ''}`;
            if (isDefaultBg) layerItem.style.cursor = 'default';
            layerItem.dataset.id = layer.id;

            let actionButtonsHTML = '';
            if (layer.deletable) {
                actionButtonsHTML += `<button class="remove-layer-btn text-gray-400 hover:text-red-500 text-xl mr-2">&times;</button>`;
            }
            if (!isDefaultBg) {
                actionButtonsHTML += `<div class="flex flex-col mr-2">
                    <button class="move-layer-up-btn text-gray-400 hover:text-gray-200">&#9650;</button>
                    <button class="move-layer-down-btn text-gray-400 hover:text-gray-200">&#9660;</button>
                </div>`;
            }

            let editButtonsHTML = '';
            if (layer.type === 'text' || layer.type === 'headshot') {
                 editButtonsHTML += `<button class="duplicate-layer-btn text-gray-400 hover:text-green-500 p-1 rounded border border-transparent hover:border-gray-500" title="Duplicate Layer">

        function addControlPanelListeners() {
            if (state.selectedIds.length !== 1) return;
            const selectedId = state.selectedIds[0];
            const item = state.layers.find(l => l.id === selectedId);
            if (!item) return;

            function addContinuousInputListeners(element, updateCallback) {
                if (!element) return;
                element.addEventListener('input', () => { updateCallback(); renderPreviewAndCode(); });
                element.addEventListener('change', saveState);
            }

            if (item.type === 'headshot') {
                document.getElementById('shape-toggle-btn')?.addEventListener('click', () => { item.shape = item.shape === 'circle' ? 'square' : 'circle'; renderAndSave(); });
               
                const borderColorPicker = document.getElementById('border-color-input');
                const borderHexInput = document.getElementById('hex-border-color-input');
                if(borderColorPicker && borderHexInput) {
                     addContinuousInputListeners(borderColorPicker, () => {
                         item.borderColor = borderColorPicker.value;
                         borderHexInput.value = borderColorPicker.value.toUpperCase();
                     });
                     addContinuousInputListeners(borderHexInput, () => {
                          if (/^#([A-Fa-f0-9]{6}|[A-Fa-f0-9]{3})$/.test(borderHexInput.value.trim())) { 
                              item.borderColor = borderHexInput.value.trim();
                              borderColorPicker.value = borderHexInput.value.trim();
                          }
                     });
                }
                document.getElementById('show-default-toggle')?.addEventListener('change', (e) => {
                    item.showDefault = e.target.checked;
                    renderAndSave();
                });

                addSliderListeners('imageSize', (val) => { item.width = val; item.height = val; });
                addSliderListeners('imgX', (val) => { item.x = val; });
                addSliderListeners('imgY', (val) => { item.y = val; });
                addSliderListeners('border-width', (val) => { item.borderWidth = val; });
                addSliderListeners('corner-radius', (val) => { item.cornerRadius = val; });
                addSliderListeners('headshot-rot', (val) => { item.rotation = val; });
            } else if (item.type === 'text') {
                document.getElementById('is-bold-input')?.addEventListener('click', () => { item.isBold = !item.isBold; renderAndSave(); });
                document.getElementById('is-italic-input')?.addEventListener('click', () => { item.isItalic = !item.isItalic; renderAndSave(); });
                document.getElementById('is-underline-input')?.addEventListener('click', () => { item.isUnderline = !item.isUnderline; renderAndSave(); });
               
                const justifyBtn = document.getElementById('justify-btn');
                if(justifyBtn) {
                    const justifyCycle = ['left', 'center', 'right'];
                    justifyBtn.innerHTML = {'left': '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M1 4H15M1 8H10M1 12H15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>','center': '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M1 4H15M3 8H13M1 12H15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>','right': '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M1 4H15M6 8H15M1 12H15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>'}[item.justify];
                    justifyBtn.addEventListener('click', () => {
                        const nextIndex = (justifyCycle.indexOf(item.justify) + 1) % justifyCycle.length;
                        item.justify = justifyCycle[nextIndex];
                        renderAndSave();
                    });
                }

                addContinuousInputListeners(document.getElementById('font-family-input'), () => { item.fontFamily = document.getElementById('font-family-input').value; });
                const colorPicker = document.getElementById('color-input');
                const hexInput = document.getElementById('hex-color-input');
                if(colorPicker && hexInput) {
                     addContinuousInputListeners(colorPicker, () => {
                         item.color = colorPicker.value;
                         hexInput.value = colorPicker.value.toUpperCase();
                     });
                     addContinuousInputListeners(hexInput, () => {
                          if (/^#([A-Fa-f0-9]{6}|[A-Fa-f0-9]{3})$/.test(hexInput.value.trim())) { 
                              item.color = hexInput.value.trim();
                              colorPicker.value = hexInput.value.trim();
                          }
                     });
                }

                addSliderListeners('font-size', (val) => { item.fontSize = val; });
                addSliderListeners('max-width', (val) => { item.maxWidth = val; });
                addSliderListeners('text-x', (val) => { item.x = val; });
                addSliderListeners('text-y', (val) => { item.y = val; });
                addSliderListeners('text-rot', (val) => { item.rotation = val; });
            }
        }

        function addSliderListeners(baseId, updateCallback) {
            const numInput = document.getElementById(`${baseId}-input`);
            const sliderInput = document.getElementById(`${baseId}-slider`);
            if (!numInput || !sliderInput) return;

            const handleInput = (e) => {
                const val = parseInt(e.target.value);
                if (e.target === numInput) sliderInput.value = val; else numInput.value = val;
                updateCallback(val);
                renderPreviewAndCode();
            };
           
            numInput.addEventListener('input', handleInput);
            sliderInput.addEventListener('input', handleInput);
            numInput.addEventListener('change', saveState);
            sliderInput.addEventListener('change', saveState);
        }

        function renderPreviewAndCode() {
            const defaultBackgroundLayer = state.layers.find(l => l.type === 'background' && !l.deletable);
            const bgStyle = defaultBackgroundLayer ? `background-image: url('${defaultBackgroundLayer.url}'); background-size: cover; background-position: center center;` : 'background-color: #e5e7eb;';

            let layersHTML = '';
            state.layers.forEach((layer, zIndex) => {
                if (layer.type === 'background' && !layer.deletable) return;

                let innerContentHTML = '';
                let positionStyle = '';

                if (layer.type === 'background' && layer.deletable) {
                    // This is for overlay images
                    positionStyle = `position: absolute; top: 0px; left: 0px; width: 100%; height: 100%; z-index: ${zIndex};`;
                    innerContentHTML = `<img src="${layer.url}" style="width: 100%; height: 100%; object-fit: cover;" class="fr-view" alt="Background" onerror="this.onerror=null;this.src='https://placehold.co/1200x720/EFEFEF/AAAAAA&text=Invalid+URL';">`;
                     layersHTML += `<div style="${positionStyle}">${innerContentHTML}</div>\n`;
                } else {
                    // This is for headshots and text
                    positionStyle = `position: absolute; z-index: ${zIndex}; top: 50%; left: 50%; transform: translate(calc(-50% + ${layer.x || 0}px), calc(-50% + ${layer.y || 0}px)) rotate(${layer.rotation || 0}deg);`;
                   
                    if (layer.type === 'headshot') {
                        const borderRadius = layer.shape === 'circle' ? '50%' : `${layer.cornerRadius}px`;
                        const dataBorder = layer.borderWidth > 0;
                        const borderRadiusForData = layer.shape === 'circle' ? '50%' : layer.cornerRadius;
                        innerContentHTML = `<div style="display: block; width: ${layer.width}px; height: ${layer.height}px;"><img src="${layer.url}" data-src-variable="#InfluencerImage#" data-src-visibility="${layer.showDefault}" style="width: 100%; height: 100%; border: ${layer.borderWidth}px solid ${layer.borderColor}; object-fit: cover; border-radius: ${borderRadius} !important; background-clip: border-box; font-size: 0px; margin: 0px; padding: 0px; box-sizing: border-box;" data-border="${dataBorder}" data-border-size="${layer.borderWidth}" data-border-radius="${borderRadiusForData}" bordercolor="${layer.borderColor}" alt="Headshot" onerror="this.onerror=null;this.src='https://placehold.co/400x400/EFEFEF/AAAAAA&text=Invalid+URL';"></div>`;
                    } else if (layer.type === 'text') {
                        const fontWeight = layer.isBold ? '700' : '400';
                        const fontStyle = layer.isItalic ? 'italic' : 'normal';
                        const textDecoration = layer.isUnderline ? 'underline' : 'none';
                        innerContentHTML = `<div style="text-align: ${layer.justify}; max-width: ${layer.maxWidth}px; overflow-wrap: break-word;"><p style="margin: 0px; line-height: 1.15; font-family: '${layer.fontFamily}', sans-serif; font-size: ${layer.fontSize}px; font-weight: ${fontWeight}; font-style: ${fontStyle}; text-decoration: ${textDecoration}; color: ${layer.color};">${layer.text}</p></div>`;
                    }

                    layersHTML += `
                        <div style="${positionStyle}">
                            <div class="fr-wrapper" dir="auto">
                                <div aria-disabled="false" class="fr-element fr-view" contenteditable="true" dir="auto" spellcheck="true">
                                    ${innerContentHTML}
                                </div>
                            </div>
                        </div>\n`;
                }
            });

            const finalHTML = `
<header class="charlie-display-font fdb-block pt-0 fp-active" data-block-type="call_to_action" draggable="false" style="height: 720px; position: relative; overflow: hidden; ${bgStyle}">
    <div class="container h-100">
        <div class="align-items-center h-100 row">
            <div class="col-md-12">
                <div class="fr-wrapper" dir="auto">
                    <div aria-disabled="false" class="fr-element fr-view" contenteditable="true" dir="auto" spellcheck="true">
                        ${layersHTML.trim()}
                    </div>
                </div>
            </div>
        </div>
    </div>
</header>`;

            previewArea.innerHTML = finalHTML;
            codeOutput.value = finalHTML;
        }


        function duplicateLayer(layerId) {
            const originalLayer = state.layers.find(l => l.id === layerId);
            if (!originalLayer) return;

            const newLayer = JSON.parse(JSON.stringify(originalLayer));
            newLayer.id = `layer-${Date.now()}-${Math.random()}`;
            newLayer.name = `Copy of ${originalLayer.name}`;
            newLayer.y += 20; // Offset the new layer

            const originalIndex = state.layers.findIndex(l => l.id === layerId);
            state.layers.splice(originalIndex + 1, 0, newLayer);

            state.selectedIds = [newLayer.id];
            lastClickedLayerId = newLayer.id;
            renderAndSave();
        }

        function moveLayer(layerId, direction) {
            const index = state.layers.findIndex(l => l.id === layerId);
            if (index === -1) return;

            if (state.layers[index].type === 'background' && !state.layers[index].deletable) return;

            const newIndex = direction === 'up' ? index - 1 : index + 1;
            if (newIndex < 0 || newIndex >= state.layers.length) return;
            if(state.layers[newIndex].type === 'background' && !state.layers[newIndex].deletable) return;

            const [layer] = state.layers.splice(index, 1);
            state.layers.splice(newIndex, 0, layer);
            renderAndSave();
        }

        addTextLineButton.addEventListener('click', () => {
            const newLayer = createLayer('text');
            state.layers.push(newLayer);
            state.selectedIds = [newLayer.id];
            lastClickedLayerId = newLayer.id;
            renderAndSave();
        });

        addHeadshotLayerButton.addEventListener('click', () => {
            const newLayer = createLayer('headshot');
            state.layers.push(newLayer);
            state.selectedIds = [newLayer.id];
            lastClickedLayerId = newLayer.id;
            renderAndSave();
        });

        addBackgroundLayerButton.addEventListener('click', () => {
            const newLayer = createLayer('background', { 
                deletable: true, 
                url: 'https://images.unsplash.com/photo-1557682250-33bd709cbe85?q=80&w=2070&auto=format&fit=crop' 
            });
            state.layers.splice(1, 0, newLayer);
            state.selectedIds = [newLayer.id];
            lastClickedLayerId = newLayer.id;
            renderAndSave();
        });

        exportButton.addEventListener('click', () => {
            modalCodeOutput.value = codeOutput.value;
            exportCodeModal.classList.add('visible');
        });

        modalExportCloseButton.addEventListener('click', () => {
            exportCodeModal.classList.remove('visible');
        });
        exportCodeModal.addEventListener('click', (e) => {
            if (e.target === exportCodeModal) {
                exportCodeModal.classList.remove('visible');
            }
        });

        modalCopyButton.addEventListener('click', () => {
            modalCodeOutput.select();
            document.execCommand('copy');
            modalCopyText.textContent = 'Copied!';
            setTimeout(() => {
                modalCopyText.textContent = 'Copy';
            }, 2000);
        });

        const darkModeToggle = document.getElementById('dark-mode-toggle');
        if (localStorage.getItem('darkMode') === 'enabled') {
            document.documentElement.classList.add('dark');
            darkModeToggle.checked = true;
        }
        darkModeToggle.addEventListener('change', () => {
            if (darkModeToggle.checked) {
                document.documentElement.classList.add('dark');
                localStorage.setItem('darkMode', 'enabled');
            } else {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('darkMode', 'disabled');
            }
        });

        layersWidgetHeader.addEventListener('click', () => {
            layersWidget.classList.toggle('collapsed');
        });

        function openTextEditModal(layerId) {
            currentEditingLayerId = layerId;
            const layer = state.layers.find(l => l.id === layerId);
            if (layer) {
                modalTextInput.value = layer.text;
                editTextModal.classList.add('visible');
            }
        }

        function closeTextEditModal() {
            editTextModal.classList.remove('visible');
            currentEditingLayerId = null;
        }

        modalSaveButton.addEventListener('click', () => {
            if (currentEditingLayerId) {
                const layer = state.layers.find(l => l.id === currentEditingLayerId);
                if (layer) {
                    layer.text = modalTextInput.value;
                    layer.name = modalTextInput.value || 'New Text Line';
                    renderAndSave();
                }
            }
            closeTextEditModal();
        });

        modalCancelButton.addEventListener('click', closeTextEditModal);
        editTextModal.addEventListener('click', (e) => {
            if(e.target === editTextModal) {
                closeTextEditModal();
            }
        });

        function openImageUrlEditModal(layerId) {
            currentEditingLayerId = layerId;
            const layer = state.layers.find(l => l.id === layerId);
            if (layer) {
                modalImageUrlInput.value = layer.url;
                editImageUrlModal.classList.add('visible');
            }
        }

        function closeImageUrlEditModal() {
            editImageUrlModal.classList.remove('visible');
            currentEditingLayerId = null;
        }

        modalImageUrlSaveButton.addEventListener('click', () => {
            if (currentEditingLayerId) {
                const layer = state.layers.find(l => l.id === currentEditingLayerId);
                if (layer) {
                    layer.url = modalImageUrlInput.value;
                    renderAndSave();
                }
            }
            closeImageUrlEditModal();
        });

        modalImageUrlCancelButton.addEventListener('click', closeImageUrlEditModal);
        editImageUrlModal.addEventListener('click', (e) => {
            if(e.target === editImageUrlModal) {
                closeImageUrlEditModal();
            }
        });
       
        function openBackgroundUrlEditModal(layerId) {
            currentEditingLayerId = layerId;
            const layer = state.layers.find(l => l.id === layerId);
            if (layer) {
                modalBackgroundUrlInput.value = layer.url;
                editBackgroundUrlModal.classList.add('visible');
            }
        }

        function closeBackgroundUrlEditModal() {
            editBackgroundUrlModal.classList.remove('visible');
            currentEditingLayerId = null;
        }

        modalBackgroundUrlSaveButton.addEventListener('click', () => {
            if (currentEditingLayerId) {
                const layer = state.layers.find(l => l.id === currentEditingLayerId);
                if (layer) {
                    layer.url = modalBackgroundUrlInput.value;
                    renderAndSave();
                }
            }
            closeBackgroundUrlEditModal();
        });

        modalBackgroundUrlCancelButton.addEventListener('click', closeBackgroundUrlEditModal);
        editBackgroundUrlModal.addEventListener('click', (e) => {
            if(e.target === editBackgroundUrlModal) {
                closeBackgroundUrlEditModal();
            }
        });
       
        function openDeleteConfirmModal(layerId) {
            layerToDeleteId = layerId;
            deleteConfirmModal.classList.add('visible');
        }

        function closeDeleteConfirmModal() {
            deleteConfirmModal.classList.remove('visible');
            layerToDeleteId = null;
        }

        deleteCancelBtn.addEventListener('click', closeDeleteConfirmModal);
        deleteConfirmModal.addEventListener('click', (e) => {
            if(e.target === deleteConfirmModal) closeDeleteConfirmModal();
        });

        deleteConfirmBtn.addEventListener('click', () => {
            if (layerToDeleteId) {
                const layer = state.layers.find(l => l.id === layerToDeleteId);
                if (layer) {
                    state.layers = state.layers.filter(l => l.id !== layerToDeleteId);
                    state.selectedIds = state.selectedIds.filter(id => id !== layerToDeleteId);
                    if (state.selectedIds.length === 0 && state.layers.length > 0) {
                        state.selectedIds = [state.layers[0].id];
                    } else {
                        state.selectedIds = [];
                    }
                    renderAndSave();
                }
            }
            closeDeleteConfirmModal();
        });


        // Initialize State
        const headshotLayer = createLayer('headshot');
        state.layers = [
            createLayer('background', {name: "Default Background", deletable: false}),
            headshotLayer,
            createLayer('text', {text: '#InfluencerFullName#', fontSize: 36, y: 150}),
            createLayer('text', {text: '#InfluencerJobTitle#', fontSize: 24, y: 190}),
            createLayer('text', {text: '#InfluencerCompany#', fontSize: 20, y: 220}),
        ];
        state.selectedIds = [headshotLayer.id];
        lastClickedLayerId = headshotLayer.id;
       
        saveState();
        renderFullUI();
    </script>

</body>
</html>
